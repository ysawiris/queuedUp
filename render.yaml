# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Secrets (sync:false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: queued-up
    runtime: node
    plan: free
    branch: modernize
    buildCommand: npm install
    startCommand: node app.js
    healthCheckPath: /healthcheck
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Must equal https://<your-render-url>/callback and be registered
      # in the Spotify dashboard's Redirect URIs.
      - key: SPOTIFY_CALLBACK_URL
        sync: false
      # MongoDB Atlas connection string (mongodb+srv://...).
      - key: MONGODB_URI
        sync: false
