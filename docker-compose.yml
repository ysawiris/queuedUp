services:
    web:
        build: .
        restart: always
        ports:
            - "8080:8080"
        env_file:
            - .env
        environment:
            - MONGODB_URI=mongodb://mongo:27017/queue-db
            - NODE_ENV=production
        depends_on:
            - mongo
    mongo:
        image: mongo:7
        restart: always
        volumes:
            - mongo-data:/data/db
        ports:
            - "27018:27017"

volumes:
    mongo-data:
